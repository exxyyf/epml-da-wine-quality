train:
  data_path: data/processed/processed_data.csv
  target: quality_binary
  model_name: mlp
  output_dir: models

model:
  lr:
    C: 1.0
    max_iter: 1000
    penalty: l2
    class_weight: balanced

  rf:
    n_estimators: 500
    max_depth: Null
    min_samples_split: 2

  mlp:
    hidden_layer_sizes: [100, ]
    activation: relu
    max_iter: 1000
